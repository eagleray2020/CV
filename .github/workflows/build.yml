name: Build & Push CV PDF

on:
  push:
    paths: ["cv.tex", "cv/*.tex", "cv/*.sty"]
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - uses: actions/checkout@v4
        with:
          repository: eagleray2020/website
          token: ${{ secrets.WEBSITE_PAT }}
          path: website

      - run: mkdir -p website/files
      - run: cp cv.pdf website/files/Academic_CV_Template.pdf

      - name: Commit to website
        working-directory: website
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@github.com"
          git add files/Academic_CV_Template.pdf
          git commit -m "Update CV PDF" --allow-empty || true
          git push
